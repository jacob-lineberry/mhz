name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without any code change, so scan weekly too.
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
