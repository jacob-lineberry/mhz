name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # go-version-file also honors the go.mod toolchain directive.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tool versions
        run: |
          go version
          make --version

      # The Makefile is the only place the golangci-lint version is pinned.
      - name: Read golangci-lint version from the Makefile
        id: golangci
        run: echo "version=$(make -s golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-only: true

      # Lint runs through make check, so CI has no step list that can drift
      # from the Makefile.
      - name: make check
        run: make check
